.prog{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:16px;display:flex;align-items:center;gap:12px;font-size:14px}

.g{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.f{grid-column:span 6}.s3{grid-column:span 3}.s2{grid-column:span 2}.s4{grid-column:span 4}

label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--inp);border:1px solid var(--line);border-radius:7px;padding:11px 12px;min-height:46px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px;border-color:var(--acc)}
input.bad{border-color:var(--err)}.em{color:var(--err);font-size:12px;margin-top:3px;min-height:0}
.rad{display:flex;gap:10px;flex-wrap:wrap}.rad label{display:flex;align-items:center;gap:8px;font-weight:500;border:1px solid var(--line);border-radius:7px;padding:10px 14px;margin:0;cursor:pointer;background:var(--inp)}
.rad input{width:auto;min-height:0}
.note{background:rgba(181,138,60,.12);border-left:3px solid var(--gold);padding:12px 14px;border-radius:0 7px 7px 0;font-size:14px;margin-top:6px}
ul.docs{margin:8px 0 0;padding-left:20px;font-size:14px}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:500;font-size:14px}.chk input{width:20px;min-height:20px;margin-top:2px}
.act{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
button{font:600 15px Manrope,sans-serif;border-radius:8px;padding:13px 20px;min-height:48px;cursor:pointer;border:1px solid var(--acc);background:var(--acc);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.p{color:#05212A}}
button.o{background:transparent;color:var(--acc2)}
#out{display:none}#out pre{white-space:pre-wrap;background:var(--inp);border:1px solid var(--line);border-radius:8px;padding:14px;font:13px/1.6 Manrope,sans-serif;overflow-x:auto}
footer{text-align:center;color:var(--mut);font-size:12px;padding:0 20px 30px}
@media print{header{background:none;color:#000;padding:0}.prog,.act,footer{display:none}section{break-inside:avoid;border-color:#999}body{background:#fff}}
</style>
</head>

<header><div class="wrap"><div class="brand">FICHA CADASTRAL</div><h1>Ficha cadastral do comprador</h1><p>Preencha seus dados para a análise cadastral da proposta de compra e venda. Leva cerca de 5 minutos.</p></div></header>
<main>
<div class="prog"><span id="pt">0%</span><div class="bar"><i id="pb"></i></div><span id="pc">0 de 0</span></div>

<div class="act"><button class="p" id="dl" type="button">Baixar PDF da ficha</button><button class="o" id="wa" type="button">Enviar por WhatsApp</button><button class="o" id="cp" type="button">Copiar resumo</button><button class="o" id="pr" type="button">Imprimir / salvar PDF</button></div><div class="em" id="msg" role="status"></div></section>
</main>
<footer>Seus dados são usados apenas para análise cadastral junto à M&amp;D Aliança.</footer>
